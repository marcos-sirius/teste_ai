name: Teste comparativo IA (OpenAI vs DeepSeek)

on:
  workflow_dispatch:  # aparece um botão "Run workflow" na aba Actions do GitHub

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install openai python-dotenv

      - name: Rodar o teste comparativo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python teste_comparativo_ia.py

      - name: Disponibilizar o resultado pra download
        uses: actions/upload-artifact@v4
        with:
          name: comparativo-resultado
          path: comparativo_resultado.json
